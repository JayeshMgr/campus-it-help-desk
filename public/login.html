<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>Campus IT System - Login</title>
    <meta name="description" content="Shared login page for students and IT Support Staff.">

    <!-- Link to your external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="login">

    <header>
        <h1>
            <a href="index.html">Campus IT Help Desk</a>
        </h1>
    </header>

    <main>
        <section class="login-card">
            <h2>Login</h2>
            <p class="login-intro">Students and IT Support Staff sign in here.</p>

            <form id="loginForm">
                <div class="login-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="login-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <p id="errorMessage" class="login-error"></p>

                <button type="submit" id="loginButton" class="login-button">Login</button>
            </form>

            <div class="login-links">
                <p>Don't have an account? <a href="register.html">Register as a student</a></p>
                <p><a href="index.html">Back to homepage</a></p>
            </div>
        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
