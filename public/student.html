<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <title>Campus IT System</title>
    <meta name="description" content="A brief description of your webpage for search engines.">
    
    <!-- Link to your external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <header>
        <h1>Campus IT Help Desk</h1>
    </header>

    <!-- FR-03: Form for students to submit a new IT ticket -->
    <section class="student-card">
        <h2>Submit a New Ticket</h2>

        <!-- All fields are required (FR-10) -->
        <form id="ticket-form">
            <label for="ticket-title">Title</label>
            <input type="text" id="ticket-title" name="title" required>

            <label for="ticket-category">Category</label>
            <input type="text" id="ticket-category" name="category" required>

            <label for="ticket-description">Problem Description</label>
            <textarea id="ticket-description" name="description" rows="4" required></textarea>

            <button type="submit">Submit Ticket</button>
        </form>
    </section>

    <section class="student-card">
    <!-- Main visible content goes here -->
        <h2>Listed below are your IT requests.</h2>

       <div id="request-list">
            <p>Loading Tickets...</p>
        </div>
    </section>



    <!-- Link to your external JavaScript file -->
    <script src="student.js"></script> 

    <iframe id="nr-ext-rsicon" style="position: absolute; display: none; width: 50px; height: 50px; 
    z-index: 2147483647; border-style: none; background: transparent;"></iframe>

    <button onclick="logout()">Log out</button>
</body>
</html>
