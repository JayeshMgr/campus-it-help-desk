<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <title>Campus IT System</title>
    <meta name="description" content="A brief description of your webpage for search engines.">
    
    <!-- Link to your external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>
            <a href="index.html">Campus IT Help Desk</a>
        </h1>
        <div id="admin-button">
            <button onclick="logout()">Log out</button>
        </div>
    </header>

    <!-- Main visible content goes here -->
    <h1>Submitted IT Support Tickets.</h1>
    <!-- /* Temporary testing*/<h1> This laptop isn't working.</h1>
    <button>Problem resovled.</button> -->

    <!-- Summary of all submitted tickets -->
    <h3>Ticket Overview</h3>

    <h3>Ticket Overview</h3>
    
    <div id="ticket-summary">
        <p>Total Tickets: <span id="total-count">0</span></p>
        <p>Open: <span id="open-count">0</span></p>
        <p>In Progress: <span id="progress-count">0</span></p>
        <p>Closed: <span id="closed-count">0</span></p>
    </div>
    
    <!-- Filter tickets based on their current status -->
    
   
    <label for="status-filter">Filter by Status:</label>
    <select id="status-filter">
        <option value="All">All Tickets</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Closed">Closed</option>
    </select>

    
    <div id="ticket-list"> 
        <p>Loading Tickets...</p>    
    </div>


    <!-- Link to your external JavaScript file -->
    <script src="admin.js"></script> 
    
</body>
</html>
