<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>Campus IT System - Login</title>
    <meta name="description" content="Shared login page for students and IT Support Staff.">

    <!-- Link to your external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>
            <a href="index.html">Campus IT Help Desk</a>
        </h1>
    </header>

    <main>
        <h2>Login</h2>
        <p>Students and IT Support Staff sign in here.</p>

        <form id="loginForm">
            <p>
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="password">Password</label><br>
                <input type="password" id="password" name="password" required>
            </p>

            <p id="errorMessage" style="color: #cc0000;"></p>

            <button type="submit" id="loginButton">Login</button>
        </form>

        <p>Don't have an account? <a href="register.html">Register as a student</a></p>
        <p><a href="index.html">Back to homepage</a></p>
    </main>

    <script src="login.js"></script>
</body>
</html>
