<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>Campus IT Help Desk - Create Student Account</title>
    <meta name="description" content="Create a student account for the Campus IT Help Desk.">

    <!-- Link to your external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="register">

    <header>
        <h1>
            <a href="index.html">Campus IT Help Desk</a>
        </h1>
    </header>

    <main>
        <section class="register-card">
            <h2>Create Student Account</h2>
            <p class="register-intro">Register to submit and track campus IT support requests.</p>

            <form id="registerForm" method="post">
                <div class="register-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="register-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <p id="errorMessage" class="register-error"></p>

                <button type="submit" id="registerButton" class="register-button">Create Account</button>
            </form>

            <div class="register-links">
                <p>Already have an account? <a href="login.html">Sign In</a></p>
                <p><a href="index.html">Back to homepage</a></p>
            </div>
        </section>
    </main>

     <!-- Communicate with the backend -->
    <script src="register.js"></script>
</body>
</html>
