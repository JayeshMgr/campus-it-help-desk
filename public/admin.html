<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <title>Campus IT System</title>
    <meta name="description" content="A brief description of your webpage for search engines.">
    
    <!-- Link to your external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin">
    <header>
        <h1>
            <a href="index.html">Campus IT Help Desk</a>
        </h1>
        <div class="admin-logout">
            <button onclick="logout()">Log Out</button>
        </div>
    </header>

    <main class="admin-container">
        <!-- Summary of all submitted tickets -->
        <section class="admin-section">
            <h2>Ticket Overview</h2>

            <div id="ticket-summary" class="summary-cards">
                <div class="summary-card summary-total">
                    <p class="summary-label">Total Tickets</p>
                    <span id="total-count" class="summary-number">0</span>
                </div>
                <div class="summary-card summary-open">
                    <p class="summary-label">Open</p>
                    <span id="open-count" class="summary-number">0</span>
                </div>
                <div class="summary-card summary-progress">
                    <p class="summary-label">In Progress</p>
                    <span id="progress-count" class="summary-number">0</span>
                </div>
                <div class="summary-card summary-closed">
                    <p class="summary-label">Closed</p>
                    <span id="closed-count" class="summary-number">0</span>
                </div>
            </div>
        </section>

        <!-- List of submitted tickets with a status filter -->
        <section class="admin-section">
            <div class="tickets-header">
                <h2>Submitted Tickets</h2>

                <div class="status-filter">
                    <label for="status-filter">Filter by status:</label>
                    <select id="status-filter">
                        <option value="All">All Tickets</option>
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
            </div>

            <div id="ticket-list">
                <p>Loading tickets...</p>
            </div>
        </section>
    </main>

    <!-- Link to your external JavaScript file -->
    <script src="admin.js"></script> 
    
</body>
</html>
